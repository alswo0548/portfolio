    (function () {
      const root = 'https://alswo0548.github.io/portfolio-showcase/';
      const hash = location.hash.slice(1);
      const match = /^(octv|gdq|climbing)-(.+)$/.exec(hash);
      const target = match
        ? root + match[1] + '.html#' + encodeURIComponent(match[2])
        : root + (hash === 'work' ? '#work' : '');
      location.replace(target);
    }());
  </script>
